<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <span class="brand">To-Do List</span>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
        Dark Mode
      </button>
    </div>
  </nav>

  <main class="app">
    <h1>My To-Do List</h1>
    <div class="row">
      <input id="taskInput" type="text" placeholder="Add a new task...">
      <button id="addBtn" type="button">Add</button>
    </div>
    <div class="filters" role="group" aria-label="Task filters">
      <button class="filter-btn active" data-filter="all" type="button">All</button>
      <button class="filter-btn" data-filter="active" type="button">Active</button>
      <button class="filter-btn" data-filter="completed" type="button">Completed</button>
    </div>
    <ul id="taskList"></ul>
    <p id="count" class="meta">0 tasks</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
